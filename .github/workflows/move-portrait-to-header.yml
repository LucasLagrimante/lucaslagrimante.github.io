name: Move portrait to header

on:
  push:
    paths:
      - ".github/workflows/move-portrait-to-header.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move portrait from hero to header avatar
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")

          index = index.replace(
              '<span class="brand-mark">LL</span>',
              '<span class="brand-mark"><img src="assets/lucas-portrait.webp" alt="" aria-hidden="true"></span>'
          )

          index = re.sub(
              r'\n\s*<figure class="hero-portrait" aria-hidden="true">.*?</figure>',
              '',
              index,
              flags=re.S,
          )

          index_path.write_text(index, encoding="utf-8")

          css_path = Path("css/style.css")
          css = css_path.read_text(encoding="utf-8")

          brand_css = '''.brand-mark {
            width: 2.35rem;
            height: 2.35rem;
            flex: 0 0 2.35rem;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 50%;
            border: 1px solid rgba(240, 244, 237, 0.22);
            background: var(--surface);
            box-shadow: 0 0 0 1px rgba(200, 255, 98, 0.08);
            transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
          }

          .brand-mark img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: 50% 34%;
            transform: scale(1.04);
          }

          .brand:hover .brand-mark,
          .brand:focus-visible .brand-mark {
            border-color: rgba(200, 255, 98, 0.62);
            box-shadow: 0 0 0 2px rgba(200, 255, 98, 0.10);
            transform: translateY(-1px);
          }'''

          css, count = re.subn(
              r'\.brand-mark \{.*?\n\}',
              brand_css,
              css,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Could not replace .brand-mark block")

          css = re.sub(
              r'\n\n/\* Hero portrait \*/.*\Z',
              '',
              css,
              flags=re.S,
          ).rstrip() + "\n"

          css_path.write_text(css, encoding="utf-8")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css
          git diff --cached --quiet && exit 0
          git commit -m "Move portrait to header avatar"
          git push
