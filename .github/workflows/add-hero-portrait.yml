name: Add hero portrait

on:
  push:
    paths:
      - ".github/workflows/add-hero-portrait.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add portrait to hero
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import base64

          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")
          canvas = '      <canvas id="particles" aria-hidden="true"></canvas>\n'
          portrait = '''      <figure class="hero-portrait" aria-hidden="true">
                <img src="assets/lucas-portrait.webp" alt="">
                <figcaption><span>PROFILE / 01</span><span>LL</span></figcaption>
              </figure>
          '''
          if 'class="hero-portrait"' not in html:
              if canvas not in html:
                  raise SystemExit("Hero canvas anchor not found")
              html = html.replace(canvas, canvas + portrait, 1)
              html_path.write_text(html, encoding="utf-8")

          css_path = Path("css/style.css")
          css = css_path.read_text(encoding="utf-8")
          styles = r'''

          /* Hero portrait */
          .hero-portrait {
            position: absolute;
            z-index: 4;
            right: clamp(0.9rem, 2.2vw, 1.4rem);
            bottom: 2.55rem;
            width: clamp(150px, 32%, 220px);
            aspect-ratio: 4 / 5;
            margin: 0;
            overflow: hidden;
            border: 1px solid rgba(240, 244, 237, 0.2);
            background: var(--bg);
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.46), 0 0 0 1px rgba(200, 255, 98, 0.06);
            pointer-events: none;
          }

          .hero-portrait::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(180deg, transparent 58%, rgba(8, 10, 9, 0.78) 100%);
            box-shadow: inset 0 0 0 1px rgba(8, 10, 9, 0.34);
          }

          .hero-portrait::after {
            content: "";
            position: absolute;
            z-index: 3;
            top: -1px;
            right: -1px;
            width: 2rem;
            height: 2rem;
            border-top: 2px solid var(--accent);
            border-right: 2px solid var(--accent);
          }

          .hero-portrait img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: 50% 38%;
            filter: saturate(0.86) contrast(1.04);
          }

          .hero-portrait figcaption {
            position: absolute;
            z-index: 3;
            left: 0.65rem;
            right: 0.65rem;
            bottom: 0.55rem;
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            color: rgba(240, 244, 237, 0.72);
            font-family: var(--font-mono);
            font-size: 0.48rem;
            letter-spacing: 0.12em;
            line-height: 1;
            text-transform: uppercase;
          }

          @media (max-width: 980px) {
            .hero-portrait {
              width: min(31vw, 190px);
              right: 1rem;
              bottom: 2.45rem;
            }
          }

          @media (max-width: 640px) {
            .hero-portrait {
              width: min(34vw, 132px);
              top: 2.65rem;
              right: 0.7rem;
              bottom: auto;
            }

            .hero-portrait figcaption span:first-child { display: none; }
          }
          '''
          if "/* Hero portrait */" not in css:
              css_path.write_text(css + styles, encoding="utf-8")

          portrait_data = """"""
          Path("assets/lucas-portrait.webp").write_bytes(base64.b64decode(portrait_data))
          PY

      - name: Commit portrait
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css assets/lucas-portrait.webp
          git diff --cached --quiet || git commit -m "Add portrait to portfolio hero"
          git push
